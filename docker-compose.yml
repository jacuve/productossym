
services:
  php:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://symfony:password@database:5432/symfony?serverVersion=16&charset=utf8
    depends_on:
      - database

  database:
    image: postgres:16
    environment:
      - POSTGRES_USER=symfony
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=symfony
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: